<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./bestel.css">
    <title>bestellen</title>
</head>
<body>
    <div class="veld">
        <label for="voornaam">Voornaam</label>
        <input type="text" id="voornaam" name="voornaam" required>
    </div>

    <div class="veld">
        <label for="achternaam">Achternaam</label>
        <input type="text" id="achternaam" name="achternaam" required>
    </div>

    <div class="veld">
        <label for="email">E-mailadres</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="veld">
        <label for="aantal">Aantal</label>
        <select id="aantal" name="aantal">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
    </div>

    <div class="veld">
        <div class="veld vinkje">
            <input type="checkbox" id="voorwaarden" name="voorwaarden" required>
            <label for="voorwaarden">Ik ga akkoord met de voorwaarden</label>
        </div>
    </div>

    <input type="submit" value="Bestelling plaatsen" class="knop">
</body>
</html>
