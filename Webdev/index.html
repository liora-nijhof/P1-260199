<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./style.css">

        <script src="shop.js"></script>
        
        <title>manga_webshop</title>
    </head>
    <body>
        <div class="header">
            <h1>Manga webshop</h1>
            <p>Best manga's for a cheap price!</p>
        </div>
        <hr class="double">
        <div class="searchbar">
            <input type="text" placeholder="Search...">
        </div>
        <div class="sort-select">
            <select id="sort-select">
                <button>
                    <selectedcontent></selectedcontent>
                </button>

                <option value="bestselling">Bestselling</option>
                <option value="popular">Popular</option>
                <option value="low-high">Price low-high</option>
                <option value="high-low">Price high-low</option>
            </select>
        </div>

        <script src="https://raw.githubusercontent.com/janl/mustache.js/refs/heads/master/mustache.js"></script>
        <script>
            const renderer = {
                to_html(template, products) {
                    return products.map(product => {
                        return template.replace(/\{\{(\w+)\}\}/g, (match, key) => {
                            return product[key] !== undefined ? product[key] : '';
                        });
                    }).join('');
                }
            };

            let clicked = 0;

            let products = [
                {
                    'title': "Soul eater vol 01",
                    'price': "€" + 12.99,
                    'image': "assets/soul/volume1.jpe",
                    'style': "width:400px;height:600px;",
                    'pressed': clicked
                },
                {
                    'title': "Soul eater vol 02",
                    'price': "€" + 12.99,
                    'image': "assets/soul/volume2.jpe",
                    'style': "width:400px;height:600px;",
                    'pressed': clicked
                },
                {
                    'title': "Soul eater vol 04",
                    'price': "€" + 12.99,
                    'image': "assets/soul/volume4.jpe",
                    'style': "width:400px;height:600px;",
                    'pressed': clicked
                },
                {
                    'title': "Soul eater vol 05",
                    'price': "€" + 12.99,
                    'image': "assets/soul/volume5.jpe",
                    'style': "width:400px;height:600px;",
                    'pressed': clicked
                }
            ]

            const template = "<img src={{image}} alt={{image}} style={{style}}> <p> <h1>{{title}}</h1> <p> <h2>{{price}}</h2> <br>";

            let html = renderer.to_html(template, products);

            document.write(html)
        </script>
        
    </body>
</html>
